  const questionType = question => TYPE_ALIASES[norm(question.Tipo ?? question.type)] || norm(question.Tipo ?? question.type);
  const valueOf = (object, ...keys) => { for (const key of keys) if (object && object[key] !== undefined && object[key] !== null) return object[key]; return ''; };

  };
  const option = (value, label, selected = false) => el('option', { value, text: label, selected });

    if (!value) return '—';

    const date = new Date(raw); return Number.isNaN(date.getTime()) ? String(value) : new Intl.DateTimeFormat('es-EC', { dateStyle: 'medium' }).format(date);
  };
  const formatDateTime = value => { const date = new Date(value); return !value || Number.isNaN(date.getTime()) ? (value || '—') : new Intl.DateTimeFormat('es-EC', { dateStyle: 'medium', timeStyle: 'short' }).format(date); };
  const formatBytes = bytes => { const amount = Number(bytes) || 0; if (amount < 1024) return `${amount} B`; if (amount < 1048576) return `${(amount/1024).toFixed(1)} KB`; return `${(amount/1048576).toFixed(1)} MB`; };
  const labelize = value => String(value || '').replace(/([a-záéíóú])([A-ZÁÉÍÓÚ])/g,'$1 $2').replace(/_/g,' ').replace(/^./, letter => letter.toUpperCase());
  const safeId = value => `f-${String(value || crypto.randomUUID()).replace(/[^A-Za-z0-9_-]/g,'-')}`;
  const clientId = () => (globalThis.crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);

  function rpc(method, ...args) {
    return new Promise((resolve, reject) => {
      if (!globalThis.google || !google.script || !google.script.run) {

  function toast(title, message = '', type = 'success', timeout = 5000) {
    const region = byId('toast-region');
    const item = el('div', { class: `toast toast--${type}`, role: type === 'error' ? 'alert' : 'status' }, [

  function hydrateShell() {

  function bindGlobalEvents() {
    document.addEventListener('click', event => {

      if (nav && !nav.hidden && !nav.disabled) { event.preventDefault(); navigate(nav.dataset.nav, { process: nav.dataset.process, recordType: nav.dataset.recordType }); return; }

  function toggleSidebar() { const sidebar=byId('sidebar'); const open=!sidebar.classList.contains('is-open'); sidebar.classList.toggle('is-open',open); byId('sidebar-scrim').hidden=!open; byId('sidebar-toggle').setAttribute('aria-expanded',String(open)); }

  function navigate(view, context = {}, pushHash = true) {
    const access={dashboard:['DASHBOARD','read'],cases:['CASOS','read'],search:['BUSQUEDA','read'],'form-builder':['FORMULARIOS','edit'],catalogs:['CATALOGOS','read'],documents:['DOCUMENTOS','read'],reports:['REPORTES','read'],admin:['ADMINISTRACION','read']};
    if(access[view]&&!can(access[view][0],access[view][1])){toast('No tiene permisos para este módulo','','warning');if(view!=='dashboard')return navigate('dashboard',{},pushHash);return;}
    if(view==='capture'){const module={ATENCION:'ATENCIONES',CASO:'CASOS',NOVEDAD:'NOVEDADES',RECORRIDO:'RECORRIDOS'}[norm(context.process||'CASO')]||'RESPUESTAS';if(!can(module,'create')){toast('No tiene permisos para crear este registro','','warning');return navigate('dashboard',{},pushHash);}}

  function bindDashboard() {

  async function loadDashboard() {
    if (!can('DASHBOARD','read')) return;
    const container=byId('dashboard-kpis'); container.replaceChildren(...Array.from({length:4},()=>el('article',{class:'kpi-card skeleton-card'})));
    try { state.dashboard=await rpc(API.dashboard); renderDashboard(state.dashboard || {}); } catch(error) { showError(error,'No se pudo cargar el resumen'); clear(container).append(el('p',{class:'empty-state',text:'No hay indicadores disponibles.'})); }
  }
  function renderDashboard(data) {
    const kpis = [
      ['Casos abiertos',valueOf(data,'casesOpen','casosAbiertos'), '◇','CASOS','read'], ['Casos cerrados',valueOf(data,'casesClosed','casosCerrados'),'✓','CASOS','read'],
      ['Seguimientos próximos',valueOf(data,'upcomingFollowUps','seguimientosProximos'),'↻','SEGUIMIENTOS','read'], ['Compromisos vencidos',valueOf(data,'overdueCommitments','compromisosVencidos'),'!','COMPROMISOS','read'],
      ['Novedades pendientes',valueOf(data,'pendingNews','novedadesPendientes'),'!','NOVEDADES','read'], ['Recorridos realizados',valueOf(data,'toursCompleted','recorridosRealizados'),'↗','RECORRIDOS','read']
    ].filter(item=>can(item[4],item[5]));
    const container=clear(byId('dashboard-kpis'));

    if (!kpis.length) container.append(el('p',{class:'empty-state compact',text:'No tiene indicadores habilitados.'}));
    const status=clear(byId('cases-by-status'));
    const breakdown=valueOf(data,'casesByStatus','casosPorEstado');
    if (breakdown && typeof breakdown==='object' && Object.keys(breakdown).length) { const max=Math.max(...Object.values(breakdown).map(Number),1); Object.entries(breakdown).forEach(([name,count])=>status.append(el('div',{class:'bar-row'},[el('span',{text:labelize(name)}),el('div',{class:'bar-track'},el('div',{class:'bar-fill',style:`width:${Math.max(2,Number(count)/max*100)}%`})),el('strong',{text:count})]))); }

  }

    byId('import-source-type').addEventListener('change',toggleImportSource);byId('import-form').addEventListener('submit',validateHistoricalImport);$('[data-action="execute-import"]').addEventListener('click',executeHistoricalImport);byId('settings-form').addEventListener('submit',saveSettings);$('[data-action="run-setup"]').addEventListener('click',runSetupCheck);

  function renderUsers(){const body=clear(byId('users-table-body')),query=norm(byId('user-search').value),roleFilter=byId('user-role-filter').value,statusFilter=byId('user-status-filter').value,roles=arrayOf(state.admin?.roles);const users=arrayOf(state.admin?.users).filter(user=>(!query||norm(`${valueOf(user,'Nombre')} ${valueOf(user,'Correo')}`).includes(query))&&(!roleFilter||String(valueOf(user,'RolId'))===roleFilter)&&(statusFilter===''||String(valueOf(user,'Estado')===''||bool(valueOf(user,'Estado')))===statusFilter));users.forEach(user=>{const role=roles.find(item=>String(valueOf(item,'IdRol'))===String(valueOf(user,'RolId')));const active=valueOf(user,'Estado')===''||bool(valueOf(user,'Estado'));body.append(el('tr',{},[el('td',{text:valueOf(user,'Nombre')||'—'}),el('td',{text:valueOf(user,'Correo')}),el('td',{text:valueOf(role,'Nombre')||valueOf(user,'RolId')}),el('td',{text:formatDateTime(valueOf(user,'UltimoAcceso'))}),el('td',{},statusBadge(active?'Activo':'Inactivo')),el('td',{},el('button',{class:'icon-button',type:'button',text:'✎','aria-label':'Editar usuario',title:'Editar',dataset:{userEdit:valueOf(user,'IdUsuario')}}))]));});if(!users.length)body.append(el('tr',{},el('td',{colspan:'6'},el('p',{class:'empty-state compact',text:'No se encontraron usuarios.'}))));}

  function renderPermissionMatrix(){const body=clear(byId('permissions-table-body')),roleId=byId('permission-role-select').value;if(!roleId){body.append(el('tr',{},el('td',{colspan:'6'},el('p',{class:'empty-state compact',text:'Seleccione un rol.'}))));return;}const modules=arrayOf(state.admin?.modules),permissions=arrayOf(state.admin?.permissions);modules.forEach(module=>{const permission=permissions.find(item=>String(valueOf(item,'RolId'))===roleId&&norm(valueOf(item,'Modulo'))===norm(module))||{};const row=el('tr',{dataset:{module}});row.append(el('td',{text:labelize(module)}));['create','read','edit','delete','sensitive'].forEach(action=>row.append(el('td',{},el('input',{type:'checkbox',checked:bool(valueOf(permission,{create:'PuedeCrear',read:'PuedeLeer',edit:'PuedeEditar',delete:'PuedeEliminar',sensitive:'PuedeSensible'}[action])),dataset:{permissionAction:action},'aria-label':`${labelize(action)} ${labelize(module)}`}))));body.append(row);});}

  function extractSpreadsheetId(value){const match=String(value||'').match(/\/d\/([A-Za-z0-9_-]+)/);return match?match[1]:String(value||'').trim();}
  async function buildImportPayload(){const entity=byId('import-entity').value,type=byId('import-source-type').value;if(type==='GOOGLE_SHEET'){const spreadsheetId=extractSpreadsheetId(byId('import-sheet-id').value),sheetName=byId('import-sheet-name').value.trim();if(!spreadsheetId||!sheetName)throw new Error('Indique el Google Sheet y el nombre de la hoja.');return{table:entity,spreadsheetId,sheetName,origin:byId('import-origin-label').value.trim()};}const file=byId('import-csv').files[0];if(!file)throw new Error('Seleccione un archivo CSV.');const content=await file.text(),parsed=parseCsv(content);if(!parsed.length)throw new Error('El archivo CSV está vacío.');return{table:entity,headers:parsed[0].map(value=>String(value).replace(/^\uFEFF/,'')),rows:parsed.slice(1),fileName:file.name,sheetName:'CSV',origin:byId('import-origin-label').value.trim()};}
  function parseCsv(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const char=text[i],next=text[i+1];if(char==='"'&&quoted&&next==='"'){field+='"';i++;}else if(char==='"')quoted=!quoted;else if(char===','&&!quoted){row.push(field);field='';}else if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&next==='\n')i++;row.push(field);if(row.some(cell=>cell!==''))rows.push(row);row=[];field='';}else field+=char;}row.push(field);if(row.some(cell=>cell!==''))rows.push(row);return rows;}
  async function validateHistoricalImport(event){event.preventDefault();if(!event.currentTarget.reportValidity())return;const button=event.submitter;setButtonBusy(button,true,'Validando…');try{state.importPayload=await buildImportPayload();state.importValidation=await rpc(API.validateImport,state.importPayload);renderImportValidation(state.importValidation);toast(state.importValidation.valid?'Validación completada':'Validación con observaciones',state.importValidation.valid?'La información está lista para importar.':'Revise los errores antes de continuar.',state.importValidation.valid?'success':'warning');}catch(error){showError(error,'No se pudo validar la importación');}finally{setButtonBusy(button,false);}}

  function confirmAction({title,message,confirmText='Confirmar',requireReason=false,requiredConfirmation=''}){return new Promise(resolve=>{const dialog=byId('confirm-dialog'),accept=byId('confirm-accept'),reason=byId('confirm-reason'),reasonField=byId('confirm-reason-field'),token=byId('confirm-token'),tokenField=byId('confirm-token-field');byId('confirm-title').textContent=title;byId('confirm-message').textContent=message;accept.textContent=confirmText;reason.value='';reasonField.hidden=!requireReason;reason.required=requireReason;token.value='';tokenField.hidden=!requiredConfirmation;byId('confirm-token-label').firstChild.textContent=requiredConfirmation?`Escriba ${requiredConfirmation} `:'Confirmación exacta ';const validate=event=>{if(requireReason&&!reason.value.trim()){event.preventDefault();reason.setAttribute('aria-invalid','true');reason.focus();toast('Indique el motivo','','warning');return;}if(requiredConfirmation&&token.value!==requiredConfirmation){event.preventDefault();token.setAttribute('aria-invalid','true');token.focus();toast('La confirmación exacta no coincide','','warning');}};accept.addEventListener('click',validate);dialog.addEventListener('close',()=>{accept.removeEventListener('click',validate);reason.removeAttribute('aria-invalid');token.removeAttribute('aria-invalid');resolve(dialog.returnValue==='confirm'&&(!requireReason||Boolean(reason.value.trim()))&&(!requiredConfirmation||token.value===requiredConfirmation));},{once:true});dialog.showModal();});}
