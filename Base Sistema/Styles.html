<style>
  :root {
    --brand-950: #102c2f;
    --brand-900: #173f43;
    --brand-800: #1f555a;
    --brand-700: #276b70;
    --brand-600: #2f7e83;
    --brand-500: #3e9498;
    --brand-100: #dff0ef;
    --brand-50: #eff8f7;
    --accent-600: #c26832;
    --accent-100: #fae8da;
    --ink-950: #162426;
    --ink-800: #2c3e40;

    --ink-500: #718082;

    --radius-lg: 20px;
    --sidebar-width: 256px;
    --topbar-height: 68px;
    --focus: 0 0 0 3px rgba(62,148,152,.24);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink-950);
    background: var(--canvas);
    font-synthesis: none;
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; scroll-behavior: smooth; }
  body { min-width: 320px; min-height: 100vh; margin: 0; background: var(--canvas); color: var(--ink-950); font-size: 14px; line-height: 1.5; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button, select { cursor: pointer; }
  button:disabled, input:disabled, select:disabled, textarea:disabled { cursor: not-allowed; opacity: .58; }
  a { color: inherit; }
  h1, h2, h3, p { margin-top: 0; }

  :focus-visible { outline: none; box-shadow: var(--focus); }
  .app-shell { min-height: 100vh; }
  .topbar { position: fixed; z-index: 80; inset: 0 0 auto 0; height: var(--topbar-height); display: flex; align-items: center; gap: 14px; padding: 0 20px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }

  .brand-mark { display: grid; place-items: center; flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(145deg,var(--brand-700),var(--brand-900)); color: #fff; font-size: .78rem; font-weight: 800; letter-spacing: .06em; box-shadow: 0 5px 12px rgba(23,63,67,.2); }

  .brand-copy small, .user-copy small { color: var(--ink-500); font-size: .73rem; }
  .topbar-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; margin-left: auto; }
  .icon-button { position: relative; display: inline-grid; place-items: center; min-width: 38px; height: 38px; padding: 0 9px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--ink-600); transition: .18s ease; }
  .icon-button:hover { border-color: var(--line); background: var(--surface-soft); color: var(--brand-800); }
  .notification-dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border: 2px solid #fff; border-radius: 50%; background: var(--danger); }
  .search-trigger { display: flex; align-items: center; gap: 9px; width: min(32vw,380px); height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-soft); color: var(--ink-500); text-align: left; }
  .search-trigger kbd { margin-left: auto; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 5px; background: #fff; color: var(--ink-500); font: inherit; font-size: .72rem; }
  .user-chip { display: flex; align-items: center; gap: 9px; min-height: 44px; padding: 4px 7px 4px 5px; border: 1px solid transparent; border-radius: 12px; background: transparent; text-align: left; }

  .nav-item:hover { background: var(--surface-soft); color: var(--ink-950); }

  .nav-icon { display: grid; place-items: center; width: 21px; color: currentColor; font-size: 1.05rem; }

  .sidebar-footer > span:last-child { display: grid; }

  .app-main { min-height: 100vh; margin-left: var(--sidebar-width); padding: calc(var(--topbar-height) + 28px) clamp(18px,3vw,42px) 50px; }
  .view { width: min(100%,1500px); margin: 0 auto; }
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
  .page-header--compact { margin-bottom: 16px; }
  .page-description { max-width: 720px; margin-bottom: 0; color: var(--ink-600); }

  .back-link { display: inline-flex; gap: 6px; padding: 0; margin-bottom: 12px; border: 0; background: none; color: var(--brand-700); font-weight: 700; }
  .title-with-badge { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .title-with-badge h1 { margin-bottom: 0; }

  .card { border: 1px solid rgba(200,211,211,.9); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 20px 22px 15px; }
  .card-header p { margin-bottom: 0; color: var(--ink-500); font-size: .82rem; }
  .button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 39px; padding: 8px 15px; border: 1px solid transparent; border-radius: 9px; font-weight: 700; text-decoration: none; transition: .17s ease; }

  .field { display: grid; align-content: start; gap: 6px; min-width: 0; }
  .field label, fieldset > legend { color: var(--ink-800); font-size: .78rem; font-weight: 750; }
  .field input, .field select, .field textarea, .compact-field select, .toolbar > select, .toolbar > input, .header-actions > select, .header-actions > input, .results-tools select {
    width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; transition: .15s ease;
  }

  .field input[aria-invalid="true"], .field select[aria-invalid="true"], .field textarea[aria-invalid="true"] { border-color: var(--danger); background: #fffafa; }
  .field-error { color: var(--danger); font-size: .74rem; }
  .field-help { color: var(--ink-500); font-size: .73rem; }

  .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; padding: 0 22px 22px; }
  .form-grid--3 { grid-template-columns: repeat(3,minmax(0,1fr)); padding: 0; }
  .form-grid--4 { grid-template-columns: repeat(4,minmax(0,1fr)); padding: 0; }
  .field--span-2 { grid-column: span 2; }
  .form-actions-row { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .form-actions-row .save-status { margin-right: auto; }
  .toggle-label { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-600); font-size: .8rem; }

  .toolbar > select, .toolbar > input { width: auto; min-width: 170px; }
  .search-field { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 9px; background: #fff; color: var(--ink-500); }
  .search-field input { width: 100%; min-width: 0; padding: 0; border: 0; outline: 0; background: transparent; }
  .search-field:focus-within { border-color: var(--brand-500); box-shadow: var(--focus); }

  .search-field--hero { min-height: 48px; flex: 1; font-size: .93rem; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; margin-bottom: 16px; }
  .kpi-card { position: relative; min-height: 132px; padding: 19px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow-sm); }

  .kpi-label { display: flex; justify-content: space-between; color: var(--ink-600); font-size: .78rem; font-weight: 700; }

  .kpi-value { display: block; margin: 10px 0 4px; font-size: 1.9rem; line-height: 1; letter-spacing: -.04em; }
  .kpi-trend { color: var(--ink-500); font-size: .73rem; }

  .dashboard-grid { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(300px,.8fr); gap: 16px; }
  .dashboard-panel { min-height: 310px; }
  .dashboard-panel--wide { min-height: 340px; }
  .bar-chart { display: grid; align-content: center; gap: 15px; min-height: 245px; padding: 12px 22px 24px; }
  .bar-row { display: grid; grid-template-columns: minmax(90px,140px) 1fr 38px; align-items: center; gap: 10px; font-size: .78rem; }
  .bar-track { height: 9px; border-radius: 99px; background: var(--brand-50); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg,var(--brand-600),var(--brand-500)); }
  .donut-layout { display: flex; align-items: center; justify-content: center; gap: 24px; min-height: 230px; padding: 10px 22px 25px; }
  .donut-placeholder { display: grid; place-items: center; width: 132px; height: 132px; border-radius: 50%; background: conic-gradient(var(--brand-700) 0 46%,var(--accent-600) 46% 70%,#d5a62e 70% 87%,var(--line) 87%); box-shadow: inset 0 0 0 33px #fff; }
  .legend-list { display: grid; gap: 8px; min-width: 125px; }
  .legend-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--ink-600); font-size: .77rem; }
  .legend-item span:first-child::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: var(--legend,var(--brand-500)); }
  .timeline-list, .activity-list { display: grid; gap: 0; padding: 0 20px 18px; }

  .timeline-item p, .activity-item p { margin: 2px 0 0; color: var(--ink-500); font-size: .75rem; }
  .timeline-item time, .activity-item time { color: var(--ink-500); font-size: .72rem; white-space: nowrap; }
  .skeleton-card { background: linear-gradient(100deg,#fff 20%,#f2f6f5 40%,#fff 60%); background-size: 300% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { to { background-position: -150% 0; } }

  .capture-layout { display: grid; grid-template-columns: 245px minmax(0,820px); justify-content: center; gap: 18px; }
  .capture-aside { position: sticky; top: calc(var(--topbar-height) + 18px); align-self: start; padding: 18px; }
  .section-nav { display: grid; gap: 3px; margin: 18px -7px; }

  .section-nav button.is-active { border-left-color: var(--brand-600); color: var(--brand-800); font-weight: 700; }
  .privacy-note { display: flex; gap: 9px; padding: 12px; border-radius: 10px; background: var(--brand-50); color: var(--brand-900); }
  .privacy-note p { margin: 3px 0 0; color: var(--ink-600); font-size: .7rem; }
  .privacy-icon { flex: none; }
  .dynamic-form-container { display: grid; gap: 14px; }
  .form-section-card { scroll-margin-top: calc(var(--topbar-height) + 15px); padding: 22px; }
  .form-section-card > header { margin-bottom: 21px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .form-section-card > header h2 { font-size: 1.23rem; }
  .form-section-card > header p { margin: 5px 0 0; color: var(--ink-500); }
  .dynamic-fields { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 19px 16px; }
  .dynamic-field { position: relative; display: grid; align-content: start; gap: 6px; min-width: 0; }
  .dynamic-field.is-full { grid-column: span 2; }
  .dynamic-field > label, .dynamic-field legend { font-weight: 700; color: var(--ink-800); }
  .dynamic-field input:not([type="radio"]):not([type="checkbox"]), .dynamic-field textarea, .dynamic-field select { width: 100%; min-height: 42px; padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; }
  .dynamic-field textarea { resize: vertical; }
  .dynamic-field input:focus, .dynamic-field textarea:focus, .dynamic-field select:focus { outline: 0; border-color: var(--brand-500); box-shadow: var(--focus); }
  .dynamic-field input[readonly], .dynamic-field textarea[readonly], .dynamic-field select:disabled { background: var(--surface-soft); }
  .field-description { margin: -2px 0 0; color: var(--ink-500); font-size: .74rem; }
  .choice-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice-option { display: inline-flex; align-items: center; gap: 7px; min-height: 39px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); }
  .choice-option input { accent-color: var(--brand-700); }
  .likert-group { display: grid; grid-template-columns: repeat(auto-fit,minmax(58px,1fr)); gap: 7px; }
  .likert-option { display: grid; place-items: center; gap: 4px; min-height: 58px; padding: 7px; border: 1px solid var(--line); border-radius: 9px; }
  .file-field { padding: 15px; border: 1px dashed var(--line-strong); border-radius: 10px; background: var(--surface-soft); }
  .person-picker { position: relative; }
  .person-picker > input[type="search"] { width: 100%; }
  .person-suggestions { position: absolute; z-index: 35; top: calc(100% + 5px); right: 0; left: 0; max-height: 260px; padding: 6px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: var(--shadow-md); }
  .person-suggestions button { display: grid; width: 100%; gap: 2px; padding: 9px; border: 0; border-radius: 7px; background: transparent; text-align: left; }
  .person-suggestions button:hover { background: var(--brand-50); }
  .person-suggestions small { color: var(--ink-500); }
  .form-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding: 16px 0; }
  .form-footer-right { display: flex; gap: 8px; }
  .save-status { color: var(--ink-500); font-size: .77rem; }

  .builder-layout { display: grid; grid-template-columns: 280px minmax(0,1fr); gap: 17px; align-items: start; }
  .builder-sidebar { position: sticky; top: calc(var(--topbar-height) + 18px); min-height: 560px; padding: 0 14px 14px; }
  .builder-list-header { padding-left: 4px; padding-right: 4px; }
  .builder-sidebar .search-field { margin-bottom: 10px; }
  .segmented-control { display: flex; padding: 3px; border-radius: 9px; background: var(--surface-soft); }
  .segmented-control button { flex: 1; padding: 6px 4px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-500); font-size: .7rem; }
  .segmented-control button.is-active { background: #fff; color: var(--ink-950); box-shadow: var(--shadow-sm); font-weight: 700; }
  .builder-form-list { display: grid; gap: 4px; margin-top: 10px; max-height: 480px; overflow-y: auto; }

  .form-list-item.is-active { border-color: var(--brand-100); background: var(--brand-50); }
  .form-list-item strong { display: block; margin-bottom: 3px; }
  .form-list-item span { color: var(--ink-500); font-size: .7rem; }
  .builder-editor { display: grid; gap: 16px; }
  .builder-empty { min-height: 430px; }
  .builder-tip { display: flex; gap: 9px; margin: 0 22px 12px; padding: 10px 12px; border-radius: 9px; background: var(--info-soft); color: var(--info); }
  .builder-tip p { margin: 0; font-size: .75rem; }
  .question-list { display: grid; gap: 9px; padding: 0 22px 22px; margin: 0; list-style: none; }
  .question-item { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .question-item.is-inactive { opacity: .62; background: var(--surface-soft); }
  .question-order { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--surface-soft); color: var(--ink-500); font-weight: 700; }
  .question-copy { min-width: 0; }
  .question-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .question-meta { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; color: var(--ink-500); font-size: .69rem; }
  .question-actions { display: flex; gap: 2px; }
  .question-actions button { min-width: 32px; height: 32px; }

  .badge { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px; border-radius: 99px; background: var(--surface-soft); color: var(--ink-600); font-size: .68rem; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
  .badge--draft { background: var(--warning-soft); color: var(--warning); }
  .badge--published, .badge--active, .badge--success { background: var(--success-soft); color: var(--success); }
