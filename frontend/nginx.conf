worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=sits_login_per_ip:10m rate=10r/m;
    server {
        listen 8080;
        client_max_body_size 11m;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' https:" always;
        location = /healthz { access_log off; return 200 'ok'; }
        error_page 429 = @rate_limited;
        error_page 413 = @file_too_large;
        location @file_too_large {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            return 413 '{"ok":false,"code":"FILE_TOO_LARGE","message":"El archivo supera el tamaño máximo permitido.","correlationId":""}';
        }
        location @rate_limited {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header Retry-After 60 always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            return 429 '{"ok":false,"code":"RATE_LIMITED","message":"Demasiadas solicitudes. Intente nuevamente en unos minutos.","correlationId":""}';
        }
        location = /api/v1/auth/login {
            limit_req zone=sits_login_per_ip burst=10 nodelay;
            limit_req_status 429;
            set $backend http://backend:8000;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
